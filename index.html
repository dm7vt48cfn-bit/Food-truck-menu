<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Truck Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    .menu-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .menu-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Our Menu</h1>
  <div class="menu-container">
    <img src="menu-1.jpg" alt="Menu page 1">
    <img src="menu-2.jpg" alt="Menu page 2">
  </div>
</body>
</html>
