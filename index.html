<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Truck Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; }
    .menu-container {
      width: 100%;
      max-width: 800px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .menu-container img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <h1>Our Menu</h1>
  <div class="menu-container">
    <img src="menu.jpg" alt="
Food truck menu">
  </div>
</body>
</html>
